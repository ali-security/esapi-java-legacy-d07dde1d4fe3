# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional surefire -Dtest selector; empty runs the full suite'
        required: false
        default: ''

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v2
    - name: Set up JDK 1.8
      uses: actions/setup-java@v1
      with:
        java-version: 1.8
    - name: Build with Maven
      run: |
        if [ -n "${{ inputs.test-filter }}" ]; then
          mvn -B package --file pom.xml -Dtest="${{ inputs.test-filter }}" -Dsurefire.failIfNoSpecifiedTests=false
        else
          mvn -B package --file pom.xml
        fi
    - name: Upload jars
      uses: actions/upload-artifact@v4
      with:
        name: esapi-jars
        path: |
          target/esapi-*.jar
          !target/esapi-*-sources.jar
          !target/esapi-*-javadoc.jar
        if-no-files-found: error
